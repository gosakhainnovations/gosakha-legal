<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terms of Service | GoSakha Innovations LLP</title>
  <style>
    body {
      max-width: 850px;
      margin: 40px auto;
      padding: 0 22px;
      font-family: Arial, sans-serif;
      line-height: 1.7;
      color: #222;
    }
    a { color: #176b57; }
    h1, h2, h3 { color: #153e35; }
  </style>
</head>
<body>
  <p><a href="https://gosakhainnovations.com/">
    GoSakha Innovations LLP
  </a></p>
  <main id="content">Loading Terms of Service...</main>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    fetch('/terms-of-service.md')
      .then(response => {
        if (!response.ok) throw new Error('Terms not found');
        return response.text();
      })
      .then(markdown => {
        document.getElementById('content').innerHTML =
          marked.parse(markdown);
      })
      .catch(() => {
        document.getElementById('content').textContent =
          'Unable to load the Terms of Service. Please try again later.';
      });
  </script>
</body>
</html>
